---
# 功能说明：在集群中删除资源，支持pods, configmaps
# 参数说明:
#   resource-delete模版参数说明:
#     1. image: 删除资源使用的工具镜像
#     2. namespace: 删除资源所在的命名空间
#     3. object-type: 删除资源的类型, 支持pods/configmaps
#     4. object-count: 删除资源的数量
#     5. num-clients: 删除资源的客户端数量
#     6. qps: 删除资源的QPS
#     7. delete-all: 是否删除所有资源
#     8. kubeconfig-secret-name: 用于指定接入的K8s集群的kubeconfig凭证的secret名称, 如果为空，则默认为当前集群
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: resource-delete
spec:
  entrypoint: resource-delete
  templates:
  - name: resource-delete
    inputs:
      parameters:
      - name: image
        default: "ccr.ccs.tencentyun.com/tkeimages/tke-chaos:v0.0.5"
        description: "删除资源使用的工具镜像"
      - name: namespace
        description: "删除资源所在的命名空间"
      - name: object-type
        default: "pods"
        description: "删除资源的类型, 支持pods/configmaps"
      - name: object-count
        default: "100"
        description: "创建资源的数量"
      - name: num-clients
        default: "10"
        description: "创建资源的客户端数量"
      - name: qps
        default: "10"
        description: "创建资源的QPS"
      - name: kubeconfig-secret-name
        description: "用于指定接入的K8s集群的kubeconfig凭证的secret名称, 如果为空，则默认为当前集群"
    steps:
    - - name: internal-resource-delete
        arguments:
          parameters:
          - name: image
            value: "{{inputs.parameters.image}}"
          - name: namespace
            value: "{{inputs.parameters.namespace}}"
          - name: object-type
            value: "{{inputs.parameters.object-type}}"
          - name: object-count
            value: "{{inputs.parameters.object-count}}"
          - name: num-clients
            value: "{{inputs.parameters.num-clients}}"
          - name: qps
            value: "{{inputs.parameters.qps}}"
        template: internal-resource-delete
        when: "'{{inputs.parameters.kubeconfig-secret-name}}' == ''"
    - - name: external-resource-delete
        arguments:
          parameters:
          - name: image
            value: "{{inputs.parameters.image}}"
          - name: namespace
            value: "{{inputs.parameters.namespace}}"
          - name: object-type
            value: "{{inputs.parameters.object-type}}"
          - name: object-count
            value: "{{inputs.parameters.object-count}}"
          - name: num-clients
            value: "{{inputs.parameters.num-clients}}"
          - name: qps
            value: "{{inputs.parameters.qps}}"
          - name: kubeconfig-secret-name
            value: "{{inputs.parameters.kubeconfig-secret-name}}"
        template: external-resource-delete
        when: "'{{inputs.parameters.kubeconfig-secret-name}}' != ''"

  - name: internal-resource-delete
    inputs:
      parameters:
      - name: image
      - name: namespace
      - name: object-type
      - name: object-count
      - name: num-clients
      - name: qps
    container:
      image: "{{inputs.parameters.image}}"
      command:
      - /kubestress
      - delete
      - --namespace={{inputs.parameters.namespace}}
      - --object-type={{inputs.parameters.object-type}}
      - --object-count={{inputs.parameters.object-count}}
      - --num-clients={{inputs.parameters.num-clients}}
      - --qps={{inputs.parameters.qps}}

  - name: external-resource-delete
    inputs:
      parameters:
      - name: image
      - name: namespace
      - name: object-type
      - name: object-count
      - name: num-clients
      - name: qps
      - name: kubeconfig-secret-name
    container:
      image: "{{inputs.parameters.image}}"
      command:
      - /kubestress
      - delete
      - --kubeconfig=/.kube/config
      - --namespace={{inputs.parameters.namespace}}
      - --object-type={{inputs.parameters.object-type}}
      - --object-count={{inputs.parameters.object-count}}
      - --num-clients={{inputs.parameters.num-clients}}
      - --qps={{inputs.parameters.qps}}
      volumeMounts:
      - name: kubeconfig
        mountPath: "/.kube"
        readOnly: true
    volumes:
    - name: kubeconfig
      secret:
        secretName: "{{inputs.parameters.kubeconfig-secret-name}}"
        items:
        - key: config
          path: config
